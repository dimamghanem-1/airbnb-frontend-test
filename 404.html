<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Airdnd</title>
    <!--
      GitHub Pages serves this file for any unknown path. We stash the
      requested path in the query string and bounce to the SPA entry point;
      index.html restores the original URL before React Router reads it.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // "/airbnb-frontend-test"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
